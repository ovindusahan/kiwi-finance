name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiwi
          POSTGRES_PASSWORD: kiwi
          POSTGRES_DB: kiwi_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiwi -d kiwi_finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check formatting, build and test
        run: ./gradlew spotlessCheck build
      - name: Check the API contract is up to date
        run: git diff --exit-code -- ../contracts/openapi.json
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: backend/*/build/reports/tests
          retention-days: 5

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check the API types match the contract
        run: npm run generate:api && git diff --exit-code -- src/lib/api/schema.ts
      - name: Format, lint and type check
        run: npx prettier --check . && npm run lint && npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    needs: [changes, backend, web]
    # Runs once per push to main (or on demand), after the faster checks pass.
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiwi
          POSTGRES_PASSWORD: kiwi
          POSTGRES_DB: kiwi_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiwi -d kiwi_finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the API with the Akahu sandbox
        working-directory: backend
        run: |
          ./gradlew :api:bootJar
          nohup java -jar api/build/libs/api-0.1.0-SNAPSHOT.jar --spring.profiles.active=local,sandbox > ../api.log 2>&1 &
      - name: Build and start the web app
        working-directory: web
        env:
          KIWI_API_URL: http://localhost:8080
          NEXT_PUBLIC_SHOW_DEMO_ACCOUNT: "true"
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
          nohup npm start > ../web.log 2>&1 &
      - name: Wait for the demo account and the web app
        run: |
          for attempt in $(seq 1 90); do
            if grep -q "Demo account ready" api.log && curl -sf http://localhost:3000/sign-in > /dev/null; then exit 0; fi
            sleep 2
          done
          cat api.log web.log
          exit 1
      - name: Run the journeys and accessibility checks
        working-directory: web
        run: npx playwright test --project=desktop
      - name: Keep logs and traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            api.log
            web.log
            web/test-results
          retention-days: 5
