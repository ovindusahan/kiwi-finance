spring:
  application:
    name: kiwi-finance-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  default-produces-media-type: application/json

kiwi:
  auth:
    jwt-secret: ${KIWI_AUTH_JWT_SECRET:}
    issuer: kiwi-finance
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    max-failed-logins: 5
    lockout-duration: 15m
  crypto:
    active-key-id: ${KIWI_CRYPTO_ACTIVE_KEY_ID:}
  cors:
    allowed-origins: []
  akahu:
    api-url: https://api.akahu.io/v1
    oauth-url: https://oauth.akahu.nz
    portal-url: https://my.akahu.nz
    app-token: ${KIWI_AKAHU_APP_TOKEN:}
    app-secret: ${KIWI_AKAHU_APP_SECRET:}
    redirect-uri: ${KIWI_AKAHU_REDIRECT_URI:}
    connect-timeout: 5s
    read-timeout: 30s
    initial-history-days: 365
    resync-overlap-days: 7
    sync-lease: 15m
    scheduled-sync:
      enabled: true
      cron: "0 15 */6 * * *"

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
